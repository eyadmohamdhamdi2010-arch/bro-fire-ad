<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذكريات ❤️</title>
<style>
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: sans-serif;
  text-align: center;
}
h1 { color: #d4af37; padding: 20px 10px 5px; }
p { color: #ddd; }
.gallery {
  display: grid;
  gap: 20px;
  padding: 15px;
}
img {
  width: 100%;
  max-width: 500px;
  border-radius: 15px;
  border: 1px solid #555;
}
</style>
</head>
<body>
<h1>يوسف ❤️ قلبي</h1>
<p>صورة ورا صورة، وكل صورة ليها حكاية ❤️</p>
<div class="gallery">
  <img src="youssef.png" alt="يوسف">
  <img src="qalby.png" alt="قلبي">
</div>
</body>
</html>
